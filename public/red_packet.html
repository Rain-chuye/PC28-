<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红包交流群 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        .premium-header { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); color: white; }
        .red-packet-card { background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%); border: 4px solid #fdba74; border-radius: 2rem; box-shadow: 0 20px 25px -5px rgba(234, 88, 12, 0.2); }
    </style>
</head>
<body>
    <header class="premium-header p-6 shrink-0 shadow-xl flex justify-between items-center relative overflow-hidden">
        <div class="flex items-center gap-4 relative z-10">
            <button onclick="history.back()" class="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center border border-white/10"><i class="fas fa-chevron-left text-sm"></i></button>
            <div>
                <h1 class="font-black text-sm uppercase tracking-tight">福利红包交流群</h1>
                <p id="online-count" class="text-[8px] font-black opacity-60 uppercase tracking-widest">Live Rewards Group</p>
            </div>
        </div>
        <div id="mute-badge" class="hidden bg-white/20 px-3 py-1.5 rounded-xl border border-white/10 relative z-10">
            <p class="text-[9px] font-black uppercase tracking-widest">禁言中</p>
        </div>
        <i class="fas fa-gift absolute -right-4 -bottom-4 text-8xl text-white/10 rotate-12"></i>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 bg-slate-50/50"></main>

    <footer class="p-6 bg-white border-t border-slate-100 flex gap-3 shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
        <div class="w-12 h-12 rounded-2xl bg-slate-50 text-slate-400 flex items-center justify-center border border-slate-100"><i class="far fa-smile text-lg"></i></div>
        <input type="text" id="msg-input" class="flex-1 bg-slate-50 border border-slate-100 rounded-2xl px-6 outline-none font-bold text-sm" placeholder="和大家交流一下吧...">
        <button onclick="sendMsg()" class="bg-rose-500 text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl shadow-rose-100 active:scale-95 transition-all"><i class="fas fa-paper-plane"></i></button>
    </footer>

    <script>
        const room = 'red_packet';
        async function loadMsgs() {
            const res = await fetch(`/api/group_chat.php?room=${room}`).then(r => r.json());
            const settings = await fetch('/api/system_info.php').then(r => r.json());
            if(settings.success) {
                document.getElementById('mute-badge').classList.toggle('hidden', settings.data.chat_mute_all != '1');
            }
            if(res.success) {
                const box = document.getElementById('chat-box');
                const wasBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
                box.innerHTML = res.data.map(m => {
                    if(m.type === 'red_packet') {
                        return `
                            <div class="flex justify-center my-6">
                                <div onclick="claimRedPacket(${m.packet_id})" class="red-packet-card p-8 text-white w-full max-w-[280px] cursor-pointer active:scale-95 transition-all">
                                    <div class="flex flex-col items-center text-center">
                                        <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mb-4 border-2 border-white/20 shadow-inner">
                                            <i class="fas fa-gift text-2xl"></i>
                                        </div>
                                        <p class="text-[10px] font-black opacity-70 uppercase tracking-[0.2em] mb-2">Platform Bonus</p>
                                        <h4 class="text-lg font-black leading-tight">${m.message}</h4>
                                        <div class="mt-6 bg-black/10 px-6 py-2 rounded-full text-[9px] font-black uppercase tracking-widest border border-white/5">Tap to Open</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    const isRobot = m.user_id == 0;
                    return `
                        <div class="flex items-start gap-4">
                            <img src="${m.avatar || '/assets/default_avatar.png'}" class="w-10 h-10 rounded-2xl object-cover shadow-sm border-2 border-white">
                            <div class="flex-1">
                                <p class="text-[8px] font-black ${isRobot ? 'text-blue-400' : 'text-slate-300'} mb-1 uppercase tracking-widest">${m.username}</p>
                                <div class="${isRobot ? 'bg-blue-600 text-white shadow-xl shadow-blue-100' : 'bg-white text-slate-700 border border-slate-100'} p-4 rounded-3xl rounded-tl-none text-xs font-bold shadow-sm inline-block leading-relaxed">
                                    ${m.message}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                if(wasBottom) box.scrollTop = box.scrollHeight;
            }
        }
        async function sendMsg() {
            const i = document.getElementById('msg-input'); const msg = i.value.trim(); if(!msg) return;
            const res = await fetch(`/api/group_chat.php?action=send&room=${room}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg}) }).then(r => r.json());
            if(!res.success) alert(res.message); else { i.value = ''; loadMsgs(); }
        }
        async function claimRedPacket(id) {
            const res = await fetch(`/api/group_chat.php?action=claim_red_packet&room=${room}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({packet_id: id}) }).then(r => r.json());
            if(res.success) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fbbf24', '#f59e0b', '#d97706'] });
                alert('🎉 恭喜！领取到红包: ' + res.amount + ' 元');
            } else alert(res.message);
        }
        loadMsgs(); setInterval(loadMsgs, 4000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
