<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: -apple-system, sans-serif; }
        .premium-bg { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); }
        .card-p { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .avatar-frame { width: 90px; height: 90px; border-radius: 2.5rem; object-fit: cover; border: 4px solid rgba(255,255,255,0.3); }
        .menu-item { display: flex; items-center: center; gap: 1rem; padding: 1.5rem; border-bottom: 1px solid #f1f5f9; transition: 0.2s; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #f8fafc; }
        .icon-box { width: 3rem; height: 3rem; border-radius: 1.25rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
    </style>
</head>
<body class="pb-32">
    <!-- Header -->
    <header class="premium-bg p-8 pt-12 pb-24 text-white relative overflow-hidden">
        <div class="relative z-10 flex justify-between items-center mb-10">
            <h1 class="text-sm font-black tracking-[0.2em] uppercase opacity-70">My Profile</h1>
            <button onclick="location.href='/api/logout.php'" class="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center border border-white/10"><i class="fas fa-power-off text-sm"></i></button>
        </div>
        <div class="relative z-10 flex items-center gap-6">
            <div class="relative group" onclick="document.getElementById('avatar-input').click()">
                <img id="user-avatar" src="/assets/default_avatar.png" class="avatar-frame cursor-pointer hover:opacity-80 transition-opacity">
                <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="uploadAvatar(this)">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 group-hover:opacity-100"><i class="fas fa-camera text-white text-xl"></i></div>
            </div>
            <div>
                <h2 class="text-2xl font-black mb-1" id="nickname-display">Loading...</h2>
                <div class="flex items-center gap-3">
                    <span class="text-[9px] bg-white/20 px-3 py-1 rounded-full font-black uppercase tracking-widest">Premium Member</span>
                    <span class="text-[9px] opacity-60 font-bold italic">UID: <span id="user-id">0000</span></span>
                </div>
            </div>
        </div>
        <i class="fas fa-fingerprint absolute -right-10 -bottom-10 text-[15rem] text-white/5 rotate-12"></i>
    </header>

    <div class="px-6 -mt-12 space-y-6 relative z-20">
        <!-- Balance Card -->
        <div class="card-p p-8 flex justify-between items-center">
            <div>
                <p class="text-[9px] text-slate-400 font-black uppercase mb-2 tracking-widest">Available Balance</p>
                <div class="flex items-baseline gap-2">
                    <span class="text-blue-600 font-black text-3xl">¥ <span id="balance">0.00</span></span>
                </div>
            </div>
            <button onclick="location.href='/recharge.html'" class="w-14 h-14 bg-blue-600 text-white rounded-[1.5rem] flex items-center justify-center shadow-xl shadow-blue-200 active:scale-95 transition-all">
                <i class="fas fa-plus text-xl"></i>
            </button>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div onclick="location.href='/stats.html'" class="card-p p-6 flex flex-col items-center gap-3 active:scale-95 transition-all">
                <div class="icon-box bg-blue-50 text-blue-600"><i class="fas fa-chart-pie"></i></div>
                <p class="text-[10px] font-black text-slate-800 uppercase">数据报表</p>
            </div>
            <div onclick="location.href='/wallet_logs.html'" class="card-p p-6 flex flex-col items-center gap-3 active:scale-95 transition-all">
                <div class="icon-box bg-indigo-50 text-indigo-600"><i class="fas fa-receipt"></i></div>
                <p class="text-[10px] font-black text-slate-800 uppercase">账单明细</p>
            </div>
        </div>

        <!-- Menu List -->
        <div class="card-p overflow-hidden">
            <a href="/agent.html" class="menu-item">
                <div class="icon-box bg-slate-50 text-slate-400"><i class="fas fa-users-cog"></i></div>
                <div class="flex-1">
                    <p class="text-sm font-black text-slate-800">代理中心</p>
                    <p class="text-[8px] text-slate-400 font-bold uppercase">Promote & Earn</p>
                </div>
                <i class="fas fa-chevron-right text-slate-200 text-xs"></i>
            </a>
            <a href="/withdraw.html" class="menu-item">
                <div class="icon-box bg-rose-50 text-rose-500"><i class="fas fa-university"></i></div>
                <div class="flex-1">
                    <p class="text-sm font-black text-slate-800">回分申请</p>
                    <p class="text-[8px] text-slate-400 font-bold uppercase">Withdraw Funds</p>
                </div>
                <i class="fas fa-chevron-right text-slate-200 text-xs"></i>
            </a>
            <a href="/settings.html" class="menu-item">
                <div class="icon-box bg-blue-50 text-blue-600"><i class="fas fa-user-edit"></i></div>
                <div class="flex-1">
                    <p class="text-sm font-black text-slate-800">个性化设置</p>
                    <p class="text-[8px] text-slate-400 font-bold uppercase">Account Settings</p>
                </div>
                <i class="fas fa-chevron-right text-slate-200 text-xs"></i>
            </a>
        </div>
    </div>

    <!-- Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 p-4 pb-8 flex justify-around items-center z-[500] shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
        <a href="/" class="text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-compass text-xl"></i><span class="text-[8px] font-black uppercase">游戏大厅</span></a>
        <a href="/recharge.html" class="text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-wallet text-xl"></i><span class="text-[8px] font-black uppercase">充值积分</span></a>
        <button onclick="location.href='/'" class="text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-headset text-xl"></i><span class="text-[8px] font-black uppercase">在线客服</span></button>
        <a href="/profile.html" class="nav-active flex flex-col items-center gap-1"><i class="fas fa-user-ninja text-xl"></i><span class="text-[8px] font-black uppercase">账户中心</span></a>
    </nav>

    <script>
        async function load() {
            const r = await fetch('/api/user_info.php?include_avatar=1').then(r => r.json());
            if(r.success) {
                const u = r.user;
                document.getElementById('nickname-display').innerText = u.nickname || u.username;
                document.getElementById('user-id').innerText = String(u.id).padStart(4, '0');
                document.getElementById('balance').innerText = parseFloat(u.balance).toLocaleString();
                if(u.avatar) document.getElementById('user-avatar').src = u.avatar;
            } else location.href = '/login.html';
        }

        async function uploadAvatar(input) {
            const file = input.files[0]; if(!file) return;
            const reader = new FileReader(); r.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = async () => {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    const max = 200; let w = img.width, h = img.height;
                    if(w > h) { if(w > max) { h *= max/w; w = max; } } else { if(h > max) { w *= max/h; h = max; } }
                    canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h);
                    const compressed = canvas.toDataURL('image/jpeg', 0.8);
                    const res = await fetch('/api/update_avatar.php', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ avatar: compressed })
                    }).then(r => r.json());
                    if(res.success) document.getElementById('user-avatar').src = compressed;
                };
            };
            reader.readAsDataURL(file);
        }
        load();
    </script>
</body>
</html>
