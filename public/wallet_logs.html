<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账单明细 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .card-p { background: white; border-radius: 1.5rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .filter-btn { flex: 1; py: 3; border-radius: 1rem; font-size: 10px; font-weight: 900; text-transform: uppercase; border: 1px solid #e2e8f0; background: white; color: #94a3b8; transition: 0.2s; }
        .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; shadow: 0 10px 15px -3px rgba(37,99,235,0.2); }
        .tab-btn { flex: 1; py: 3; border-radius: 1rem; font-size: 11px; font-weight: 900; color: #94a3b8; transition: 0.2s; }
        .tab-btn.active { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
    </style>
</head>
<body class="p-6 pb-12">
    <header class="flex items-center gap-4 mb-8">
        <button onclick="history.back()" class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center text-slate-400 shadow-sm border border-slate-100"><i class="fas fa-chevron-left text-sm"></i></button>
        <div>
            <h1 class="text-lg font-black text-slate-800">账单明细</h1>
            <p class="text-[8px] font-black text-slate-300 uppercase tracking-widest">Transaction History</p>
        </div>
    </header>

    <!-- Main Tabs -->
    <div class="bg-white p-1.5 rounded-2xl mb-6 shadow-sm border border-slate-100 flex gap-2">
        <button onclick="switchTab('balance')" id="tab-balance" class="tab-btn active">资金明细</button>
        <button onclick="switchTab('bet')" id="tab-bet" class="tab-btn">下注记录</button>
    </div>

    <!-- Date Filters -->
    <div class="flex gap-2 mb-8">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn active">全部</button>
        <button onclick="setFilter('today')" id="filter-today" class="filter-btn">今天</button>
        <button onclick="setFilter('yesterday')" id="filter-yesterday" class="filter-btn">昨天</button>
        <button onclick="setFilter('week')" id="filter-week" class="filter-btn">本周</button>
    </div>

    <div id="log-container" class="space-y-4">
        <div class="p-10 text-center text-slate-300 font-black text-[10px] uppercase italic tracking-[0.2em]">Syncing Records...</div>
    </div>

    <script>
        let currentTab = new URLSearchParams(window.location.search).get('type') || 'balance';
        let currentFilter = 'all';

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tab-balance').className = t === 'balance' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-bet').className = t === 'bet' ? 'tab-btn active' : 'tab-btn';
            loadLogs();
        }

        function setFilter(f) {
            currentFilter = f;
            ['all','today','yesterday','week'].forEach(i => {
                document.getElementById('filter-'+i).className = i === f ? 'filter-btn active' : 'filter-btn';
            });
            loadLogs();
        }

        async function loadLogs() {
            const endpoint = (currentTab === 'balance' ? '/api/balance_logs.php' : '/api/bet_history.php') + '?filter=' + currentFilter;
            const res = await fetch(endpoint).then(r => r.json());
            const container = document.getElementById('log-container');

            if(res.success && res.data.length > 0) {
                if(currentTab === 'balance') {
                    container.innerHTML = res.data.map(l => `
                        <div class="card-p p-6 flex justify-between items-center">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 ${l.amount > 0 ? 'bg-emerald-50 text-emerald-500' : 'bg-slate-50 text-slate-400'} rounded-xl flex items-center justify-center"><i class="fas ${l.amount > 0 ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i></div>
                                <div>
                                    <p class="text-xs font-black text-slate-800">${l.description || 'System Entry'}</p>
                                    <p class="text-[8px] text-slate-300 font-bold uppercase mt-1 tracking-tighter">${l.created_at}</p>
                                </div>
                            </div>
                            <p class="text-sm font-black ${l.amount > 0 ? 'text-emerald-500' : 'text-slate-800'}">${l.amount > 0 ? '+' : ''}${parseFloat(l.amount).toLocaleString()}</p>
                        </div>
                    `).join('');
                } else {
                    const map = {'big':'大','small':'小','single':'单','double':'双','big_single':'大单','big_double':'大双','small_single':'小单','small_double':'小双','triple':'豹子','straight':'顺子','pair':'对子'};
                    container.innerHTML = res.data.map(b => `
                        <div class="card-p p-6 flex justify-between items-center">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-black text-[10px]">${map[b.play_type] || 'B'}</div>
                                <div>
                                    <p class="text-xs font-black text-slate-800">#${b.issue_no} [${map[b.play_type] || b.play_type}]</p>
                                    <p class="text-[8px] text-slate-300 font-bold uppercase mt-1 tracking-tighter">${b.created_at}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] font-black text-slate-300 uppercase mb-1">Bet: ¥${parseFloat(b.bet_amount)}</p>
                                <p class="text-xs font-black ${b.status == 1 ? 'text-blue-600' : (b.status == 2 ? 'text-slate-300' : (b.status == 4 ? 'text-rose-500' : 'text-emerald-500'))}">${b.status == 1 ? 'Win ' + b.win_amount : (b.status == 2 ? 'Miss' : (b.status == 4 ? 'Cancelled' : 'Refunded'))}</p>
                            </div>
                        </div>
                    `).join('');
                }
            } else {
                container.innerHTML = `<div class="p-16 text-center text-slate-200 font-black text-[10px] uppercase italic tracking-widest">No Records Found</div>`;
            }
        }
        switchTab(currentTab);
    </script>
</body>
</html>
