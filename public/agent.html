<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理中心 - CANADA 28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .card-p { background: white; border-radius: 2.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .tab-btn { position: relative; font-size: 11px; font-weight: 900; color: #94a3b8; padding-bottom: 12px; transition: 0.2s; }
        .tab-btn.active { color: #2563eb; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 4px; background: #2563eb; border-radius: 99px; }
    </style>
</head>
<body class="pb-32">
    <header class="flex items-center justify-between p-6 mb-4">
        <div class="flex items-center gap-4">
            <button onclick="history.back()" class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center text-slate-400 shadow-sm border border-slate-100"><i class="fas fa-chevron-left text-sm"></i></button>
            <div>
                <h1 class="text-lg font-black text-slate-800">代理合伙人</h1>
                <p class="text-[8px] font-black text-slate-300 uppercase tracking-widest">Affiliate Center</p>
            </div>
        </div>
        <i class="fas fa-user-friends text-slate-200 text-3xl"></i>
    </header>

    <main class="p-6 space-y-8">
        <!-- Stats Hero -->
        <div class="bg-blue-600 rounded-[3rem] p-10 text-white shadow-2xl shadow-blue-100 relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-[10px] font-black opacity-60 uppercase mb-3 tracking-[0.2em]">Total Rebate Balance</p>
                <div class="flex items-baseline gap-2 mb-8">
                    <span class="text-4xl font-black">¥ <span id="rebate-total">0.00</span></span>
                </div>
                <div class="grid grid-cols-2 gap-8 py-6 border-t border-white/10">
                    <div>
                        <p class="text-[9px] opacity-50 font-black uppercase tracking-widest mb-1">直属下级</p>
                        <p class="text-xl font-black" id="sub-count">0</p>
                    </div>
                    <div>
                        <p class="text-[9px] opacity-50 font-black uppercase tracking-widest mb-1">今日预估收益</p>
                        <p class="text-xl font-black" id="today-rebate">0.00</p>
                    </div>
                </div>
            </div>
            <i class="fas fa-coins absolute -right-10 -bottom-10 text-[15rem] text-white/5 rotate-12"></i>
        </div>

        <!-- Navigation -->
        <div class="flex justify-around items-center px-4 border-b border-slate-200">
            <button onclick="switchTab('invite')" id="tab-invite" class="tab-btn active uppercase tracking-widest">邀请链接</button>
            <button onclick="switchTab('subs')" id="tab-subs" class="tab-btn uppercase tracking-widest">我的团队</button>
            <button onclick="switchTab('logs')" id="tab-logs" class="tab-btn uppercase tracking-widest">收益记录</button>
        </div>

        <!-- Section: Invite -->
        <div id="section-invite" class="space-y-6">
            <div class="card-p p-10 text-center">
                <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em] mb-8">Your Invitation QR</p>
                <div id="qrcode" class="inline-block p-6 bg-slate-50 rounded-[2.5rem] border border-slate-100 mb-8 shadow-inner"></div>
                <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 flex items-center justify-between gap-4">
                    <p class="text-[10px] font-black text-slate-400 truncate text-left flex-1" id="share-link">Generating link...</p>
                    <button onclick="copyLink()" class="bg-blue-600 text-white text-[10px] px-5 py-2 rounded-xl font-black shadow-lg shadow-blue-100 uppercase tracking-widest">Copy</button>
                </div>
            </div>
        </div>

        <!-- Section: Subordinates -->
        <div id="section-subs" class="hidden space-y-4">
            <div id="subs-list" class="space-y-4">
                <div class="p-20 text-center text-slate-200 font-black text-[10px] uppercase italic tracking-widest">No active subordinates</div>
            </div>
        </div>

        <!-- Section: Logs -->
        <div id="section-logs" class="hidden">
            <div id="rebate-list" class="space-y-4">
                <div class="p-20 text-center text-slate-200 font-black text-[10px] uppercase italic tracking-widest">No rebate history</div>
            </div>
        </div>
    </main>

    <script>
        async function loadAgentData() {
            try {
                const [res, settingsRes, userRes] = await Promise.all([
                    fetch('/api/agent_subordinates.php').then(r => r.json()),
                    fetch('/api/system_info.php?action=get_settings').then(r => r.json()),
                    fetch('/api/user_info.php').then(r => r.json())
                ]);

                if(res.success) {
                    const d = res.data;
                    document.getElementById('rebate-total').innerText = d.total_rebate.toFixed(2);
                    document.getElementById('today-rebate').innerText = d.today_rebate.toFixed(2);
                    document.getElementById('sub-count').innerText = d.sub_count;

                    if(d.subordinates.length > 0) {
                        document.getElementById('subs-list').innerHTML = d.subordinates.map(s => `
                            <div class="card-p p-6 flex justify-between items-center">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 bg-slate-50 text-slate-300 rounded-2xl flex items-center justify-center font-black text-xs">${s.username[0].toUpperCase()}</div>
                                    <div>
                                        <p class="text-sm font-black text-slate-800">${s.username}</p>
                                        <p class="text-[9px] text-slate-300 font-bold uppercase mt-1">Joined: ${s.created_at.split(' ')[0]}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-black text-blue-600">¥${parseFloat(s.total_rebate_earned || 0).toFixed(2)}</p>
                                    <p class="text-[8px] text-slate-300 font-black uppercase mt-1">Total Rebate</p>
                                </div>
                            </div>
                        `).join('');
                    }
                }

                if(settingsRes.success && userRes.success) {
                    const link = settingsRes.data.agent_link_prefix + userRes.user.id;
                    document.getElementById('share-link').innerText = link;
                    const qr = qrcode(4, 'L'); qr.addData(link); qr.make();
                    document.getElementById('qrcode').innerHTML = qr.createImgTag(6, 12);
                }

                const rebateRes = await fetch('/api/balance_logs.php?type=rebate&limit=50').then(r => r.json());
                if(rebateRes.success && rebateRes.data.length > 0) {
                    document.getElementById('rebate-list').innerHTML = rebateRes.data.map(i => `
                        <div class="card-p p-6 flex justify-between items-center">
                            <div>
                                <p class="text-xs font-black text-slate-800">${i.description}</p>
                                <p class="text-[8px] text-slate-300 font-black uppercase mt-1">${i.created_at}</p>
                            </div>
                            <span class="text-sm font-black text-emerald-500">+¥${i.amount}</span>
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            ['invite', 'subs', 'logs'].forEach(t => document.getElementById('section-' + t).classList.add('hidden'));
            document.getElementById('section-' + tab).classList.remove('hidden');
        }

        function copyLink() {
            const link = document.getElementById('share-link').innerText;
            navigator.clipboard.writeText(link).then(() => alert('Promotion link copied!'));
        }

        loadAgentData();
    </script>
</body>
</html>
