<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加拿大28至尊 - 实时</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --p-blue: #2563eb; }
        body { background-color: #f8fafc; font-family: -apple-system, system-ui, sans-serif; height: 100vh; overflow: hidden; }
        .ball { width: 28px; height: 28px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; color: #1e293b; border: 1px solid #e2e8f0; }
        .ball-sum { background: var(--p-blue); color: white; border: none; }
        .tab-content { transition: max-height 0.3s ease; max-height: 0; overflow: hidden; background: white; margin-top: 10px; border-radius: 12px; }
        .tab-content.active { max-height: 250px; border: 1px solid #e2e8f0; padding: 8px; }
        .scratch-card { background: #1e293b; border-radius: 12px; position: relative; height: 80px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 4px; }
        #scratch-canvas { position: absolute; inset: 0; z-index: 10; cursor: crosshair; }
        .bet-grid-item { background: #f1f5f9; border-radius: 10px; padding: 12px 0; text-align: center; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
        .bet-grid-item.active { border-color: var(--p-blue); background: #eff6ff; color: var(--p-blue); }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="p-3 bg-white shadow-sm shrink-0">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
                <button onclick="history.back()"><i class="fas fa-chevron-left text-slate-300"></i></button>
                <span id="room-name" class="font-black text-sm">正在载入房型...</span>
            </div>
            <div class="flex gap-2">
                <span id="balance-val" class="text-[10px] font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full border border-blue-100">¥ 0.00</span>
                <span id="issue-val" class="text-[10px] font-black text-slate-400 bg-slate-50 px-2.5 py-1 rounded-full border">期号: --</span>
            </div>
        </div>

        <!-- Squeezing Area (咪牌) -->
        <div class="scratch-card">
            <canvas id="scratch-canvas"></canvas>
            <div class="flex items-center gap-1 z-0">
                <div class="ball" id="b0">-</div><span class="text-slate-500 font-bold">+</span>
                <div class="ball" id="b1">-</div><span class="text-slate-500 font-bold">+</span>
                <div class="ball" id="b2">-</div><span class="text-slate-500 font-bold">=</span>
                <div class="ball ball-sum" id="bsum">-</div>
                <div id="tags-area" class="flex gap-1 ml-2"></div>
            </div>
        </div>

        <div id="timer-text" class="text-center text-[10px] font-black text-slate-400 py-2 uppercase tracking-tighter">--:--</div>

        <!-- Tabs -->
        <div class="flex gap-2">
            <button onclick="switchTab('history')" id="btn-h" class="flex-1 py-2 bg-slate-50 rounded-xl text-[10px] font-black text-slate-400 border border-slate-100">历史走势</button>
            <button onclick="switchTab('bets')" id="btn-m" class="flex-1 py-2 bg-slate-50 rounded-xl text-[10px] font-black text-slate-400 border border-slate-100">当前投注</button>
        </div>

        <div id="panel-history" class="tab-content"><div id="list-h" class="space-y-1 overflow-y-auto max-h-40 p-1"></div></div>
        <div id="panel-bets" class="tab-content"><div id="list-m" class="space-y-1 overflow-y-auto max-h-40 p-1"></div></div>
    </header>

    <!-- Chat -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50" id="chat-container"></main>

    <!-- Footer Actions -->
    <footer class="p-3 bg-white border-t flex gap-2">
        <button onclick="document.getElementById('bet-modal').classList.add('active')" class="flex-[2] bg-blue-600 text-white h-12 rounded-xl font-black text-xs shadow-lg shadow-blue-100">立即下注</button>
        <button onclick="location.href='/recharge.html'" class="flex-1 bg-emerald-500 text-white rounded-xl text-[10px] font-black">充值</button>
        <button onclick="location.href='/withdraw.html'" class="flex-1 bg-rose-500 text-white rounded-xl text-[10px] font-black">回分</button>
    </footer>

    <!-- Betting Modal -->
    <div id="bet-modal" class="fixed inset-x-0 bottom-0 bg-white z-[500] translate-y-full transition-transform rounded-t-[2rem] shadow-2xl flex flex-col h-[75vh]">
        <div class="p-5 border-b flex justify-between items-center">
            <h3 class="font-black text-sm text-slate-800">投注中心</h3>
            <button onclick="document.getElementById('bet-modal').classList.remove('active')"><i class="fas fa-times text-slate-300"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-5"><div class="grid grid-cols-4 gap-2" id="odds-grid"></div></div>
        <div class="p-6 bg-slate-50 border-t space-y-4">
            <div class="bg-white rounded-xl p-3 flex items-center border border-slate-200">
                <span class="text-[10px] font-black text-slate-300 mr-3">金额</span>
                <input type="number" id="bet-amt" class="w-full font-black text-slate-800 outline-none" value="10">
            </div>
            <button onclick="submitAll()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black text-sm">确认下单 (<span id="sel-count">0</span>)</button>
        </div>
    </div>

    <script>
        const roomType = new URLSearchParams(window.location.search).get('room') || 'high';
        document.getElementById('room-name').innerText = roomType === 'high' ? '加拿大至尊高倍' : '加拿大标准房';

        let selected = new Set(), currentIssue = '', lastIssue = '', countdown = 0;
        const cvs = document.getElementById('scratch-canvas'), ctx = cvs.getContext('2d');

        function initCanvas() {
            cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
            ctx.fillStyle = '#475569'; ctx.fillRect(0,0,cvs.width,cvs.height);
            ctx.fillStyle = 'white'; ctx.font = '900 12px Inter'; ctx.textAlign = 'center'; ctx.fillText('左右对称揭晓 (咪牌)', cvs.width/2, cvs.height/2 + 5);
            ctx.globalCompositeOperation = 'destination-out';
        }

        cvs.addEventListener('touchmove', e => {
            e.preventDefault(); const r = cvs.getBoundingClientRect();
            const x = e.touches[0].clientX - r.left, y = e.touches[0].clientY - r.top;
            ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cvs.width - x, y, 20, 0, Math.PI*2); ctx.fill();
        });

        function switchTab(t) {
            const h = document.getElementById('panel-history'), m = document.getElementById('panel-bets');
            const bh = document.getElementById('btn-h'), bm = document.getElementById('btn-m');
            if(t === 'history') { h.classList.toggle('active'); m.classList.remove('active'); bh.classList.toggle('active'); bm.classList.remove('active'); }
            else { m.classList.toggle('active'); h.classList.remove('active'); bm.classList.toggle('active'); bh.classList.remove('active'); if(m.classList.contains('active')) loadUserBets(); }
        }

        async function loadUserBets() {
            const res = await fetch('/api/bet_history.php').then(r => r.json());
            const list = document.getElementById('list-m');
            if(res.success) {
                const cur = res.data.filter(b => b.issue_no === currentIssue && b.status == 0);
                if(cur.length === 0) { list.innerHTML = '<p class="text-center py-6 text-[10px] text-slate-300 font-bold uppercase tracking-widest">暂无当前投注</p>'; return; }
                const map = {'big':'大','small':'小','single':'单','double':'双','big_single':'大单','big_double':'大双','small_single':'小单','small_double':'小双','triple':'豹子','straight':'顺子','pair':'对子'};
                list.innerHTML = cur.map(b => `
                    <div class="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-xl mb-1 shadow-sm">
                        <div><p class="text-[10px] font-black text-slate-800">${map[b.play_type] || b.play_type} <span class="text-blue-600 ml-1">¥${parseFloat(b.bet_amount)}</span></p></div>
                        <button onclick="cancelOrder(${b.id})" class="px-4 py-1.5 bg-rose-50 text-rose-500 rounded-lg text-[10px] font-black border border-rose-100">撤单</button>
                    </div>
                `).join('');
            }
        }

        async function cancelOrder(id) {
            if(!confirm('确定要撤回这笔下单吗？将全额退款。')) return;
            const res = await fetch('/api/cancel_bet.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ bet_id: id })
            }).then(r => r.json());
            if(res.success) { loadUserBets(); poll(); } else alert(res.message);
        }

        async function poll() {
            try {
                const r = await fetch('/api/lottery.php').then(r=>r.json());
                const u = await fetch('/api/user_info.php').then(r=>r.json());
                if(r.success) {
                    if(lastIssue && lastIssue !== r.latest.issue_no) { initCanvas(); lastIssue = r.latest.issue_no; }
                    else if(!lastIssue) { lastIssue = r.latest.issue_no; initCanvas(); }
                    currentIssue = r.bet_issue_no; document.getElementById('issue-val').innerText = '期号: ' + currentIssue;
                    const n = r.latest.numbers.split(',').map(v=>parseInt(v));
                    document.getElementById('b0').innerText = n[0]; document.getElementById('b1').innerText = n[1]; document.getElementById('b2').innerText = n[2];
                    document.getElementById('bsum').innerText = r.latest.total_sum;
                    document.getElementById('tags-area').innerHTML = [parseInt(r.latest.total_sum) >= 14 ? '大' : '小', parseInt(r.latest.total_sum) % 2 != 0 ? '单' : '双'].map(t=>`<span class="px-1.5 py-0.5 bg-slate-400 text-white rounded text-[8px] font-black ${t==='大'?'bg-blue-600':''}">${t}</span>`).join('');
                    countdown = r.countdown; startTimer();
                    if(r.history) {
                        document.getElementById('list-h').innerHTML = r.history.map(h => `
                            <div class="flex justify-between items-center p-2 bg-white border border-slate-50 rounded-lg mb-1 shadow-sm">
                                <span class="text-[9px] text-slate-400 font-black">#${h.issue_no}</span>
                                <div class="flex gap-2 items-center">
                                    <div class="flex gap-0.5">${h.numbers.split(',').map(v=>`<span class="w-5 h-5 bg-slate-50 rounded-full flex items-center justify-center text-[9px] font-black border">${v}</span>`).join('')}</div>
                                    <span class="text-[10px] font-black text-blue-600 w-6 text-right">${h.total_sum}</span>
                                </div>
                            </div>
                        `).join('');
                    }
                    if(r.odds) renderOdds(r.odds);
                }
                if(u.success) document.getElementById('balance-val').innerText = '¥ ' + parseFloat(u.data.balance).toLocaleString();
                loadChat();
            } catch(e) {}
        }

        function startTimer() {
            if(window.tm) clearInterval(window.tm);
            window.tm = setInterval(() => {
                if(countdown <= 0) { clearInterval(window.tm); return; }
                countdown--; const m = Math.floor(countdown/60), s = countdown%60;
                document.getElementById('timer-text').innerHTML = countdown <= 20 ? '<span class="text-rose-500 font-black tracking-widest">封盘中</span>' : `NEXT DRAW: <span class="text-blue-600 font-black">${m}:${s<10?'0':''}${s}</span>`;
            }, 1000);
        }

        async function loadChat() {
            const r = await fetch('/api/group_chat.php?room=' + roomType).then(r => r.json());
            if(r.success) {
                const box = document.getElementById('chat-container'); const wasBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
                box.innerHTML = r.data.map(m => `
                    <div class="flex items-start gap-2.5">
                        <img src="${m.avatar || '/assets/default_avatar.png'}" class="w-8 h-8 rounded-lg object-cover shadow-sm">
                        <div class="flex-1">
                            <p class="text-[8px] font-black text-slate-400 mb-0.5 uppercase tracking-tighter">${m.username}</p>
                            <div class="bg-white border border-slate-100 p-2.5 rounded-2xl rounded-tl-none text-[11px] shadow-sm inline-block font-bold text-slate-700">${m.message}</div>
                        </div>
                    </div>
                `).join('');
                if(wasBottom) box.scrollTop = box.scrollHeight;
            }
        }

        function renderOdds(odds) {
            const g = document.getElementById('odds-grid'); g.innerHTML = '';
            const keys = ['big','small','single','double','big_single','big_double','small_single','small_double','triple','straight','pair'];
            const names = {'big':'大','small':'小','single':'单','double':'双','big_single':'大单','big_double':'大双','small_single':'小单','small_double':'小双','triple':'豹子','straight':'顺子','pair':'对子'};
            keys.forEach(k => {
                const div = document.createElement('div'); div.className = 'bet-grid-item' + (selected.has(k) ? ' active' : '');
                div.onclick = () => { if(selected.has(k)) { selected.delete(k); div.classList.remove('active'); } else { selected.add(k); div.classList.add('active'); } document.getElementById('sel-count').innerText = selected.size; };
                div.innerHTML = `<p class="text-xs">${names[k]}</p><p class="text-[8px] opacity-40 mt-1">${odds[k][roomType].toFixed(2)}</p>`;
                g.appendChild(div);
            });
        }

        async function submitAll() {
            const a = document.getElementById('bet-amt').value; if(selected.size === 0) return alert('请先选择玩法');
            const res = await fetch('/api/bet.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ bets: Array.from(selected).map(t => ({play_type: t, amount: a})), odds_type: roomType, issue_no: currentIssue })
            }).then(r => r.json());
            if(res.success) { selected.clear(); document.getElementById('sel-count').innerText = 0; document.getElementById('bet-modal').classList.remove('active'); poll(); } else alert(res.message);
        }

        window.onload = () => { initCanvas(); poll(); setInterval(poll, 2000); };
    </script>
</body>
</html>
