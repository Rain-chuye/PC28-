<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .card-p { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    </style>
</head>
<body class="p-6 pb-24">
    <header class="flex items-center gap-4 mb-8">
        <button onclick="history.back()" class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center text-slate-400 shadow-sm border border-slate-100"><i class="fas fa-chevron-left text-sm"></i></button>
        <div>
            <h1 class="text-lg font-black text-slate-800">系统设置</h1>
            <p class="text-[8px] font-black text-slate-300 uppercase tracking-widest">System Settings</p>
        </div>
    </header>

    <main class="space-y-6">
        <!-- Profile -->
        <section class="space-y-4">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">个人资料</h3>
            <div class="card-p p-8 space-y-6">
                <div class="space-y-3">
                    <p class="text-[9px] font-black text-slate-400 uppercase ml-1">个性昵称</p>
                    <input type="text" id="nick-input" class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-bold outline-none focus:border-blue-400" placeholder="设置您的公开昵称">
                </div>
                <div class="space-y-3">
                    <p class="text-[9px] font-black text-slate-400 uppercase ml-1">修改登录密码</p>
                    <input type="password" id="pass-input" class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-bold outline-none focus:border-blue-400" placeholder="留空则不修改">
                </div>
                <div class="space-y-3">
                    <p class="text-[9px] font-black text-slate-400 uppercase ml-1">绑定 QQ 号 (仅限一次)</p>
                    <input type="text" id="qq-input" class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-bold outline-none focus:border-blue-400" placeholder="输入 QQ 号">
                </div>
            </div>
        </section>

        <!-- Theme Customization -->
        <section class="space-y-4">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">视觉风格定制</h3>
            <div class="card-p p-8 space-y-6">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">全局主色调</span>
                    <input type="color" id="theme-color" value="#2563eb" class="w-12 h-12 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">常规数字颜色</span>
                    <input type="color" id="num-color" value="#334155" class="w-12 h-12 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">大小单双颜色</span>
                    <input type="color" id="bssd-color" value="#2563eb" class="w-12 h-12 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">组合特殊颜色</span>
                    <input type="color" id="special-color" value="#dc2626" class="w-12 h-12 rounded-xl cursor-pointer border-none bg-transparent">
                </div>
            </div>
        </section>

        <button onclick="saveSettings()" class="w-full bg-blue-600 text-white py-5 rounded-[1.5rem] font-black shadow-xl shadow-blue-100 active:scale-95 transition-all mt-4">确认修改</button>
    </main>

    <script>
        async function load() {
            const r = await fetch('/api/user_info.php').then(r => r.json());
            if(r.success) {
                const u = r.user;
                document.getElementById('nick-input').value = u.nickname || '';
                if(u.qq_number) {
                    const q = document.getElementById('qq-input');
                    q.value = u.qq_number; q.readOnly = true; q.style.opacity = '0.5';
                }
                if(u.settings_json) {
                    const s = JSON.parse(u.settings_json);
                    if(s.theme) document.getElementById('theme-color').value = s.theme;
                    if(s.num) document.getElementById('num-color').value = s.num;
                    if(s.bssd) document.getElementById('bssd-color').value = s.bssd;
                    if(s.special) document.getElementById('special-color').value = s.special;
                }
            }
        }

        async function saveSettings() {
            const theme = {
                theme: document.getElementById('theme-color').value,
                num: document.getElementById('num-color').value,
                bssd: document.getElementById('bssd-color').value,
                special: document.getElementById('special-color').value
            };
            const payload = {
                nickname: document.getElementById('nick-input').value,
                qq: document.getElementById('qq-input').value,
                password: document.getElementById('pass-input').value,
                theme_settings: theme
            };
            const res = await fetch('/api/update_profile.php', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(r => r.json());
            if(res.success) { alert('设置已更新'); location.href = '/profile.html'; }
            else alert(res.message);
        }
        load();
    </script>
</body>
</html>
