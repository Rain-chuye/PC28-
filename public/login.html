<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 东爷国际 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); font-family: -apple-system, sans-serif; }
        .card-auth { background: white; border-radius: 3rem; border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl text-xs font-black shadow-2xl opacity-0 transition-all pointer-events-none z-50 uppercase tracking-widest"></div>

    <div class="w-full max-w-sm card-auth p-12 relative overflow-hidden">
        <div class="relative z-10">
            <div class="w-16 h-16 bg-blue-600 rounded-[1.5rem] flex items-center justify-center text-white text-2xl font-black mb-10 shadow-xl shadow-blue-200 mx-auto rotate-3">
                <i class="fas fa-dice"></i>
            </div>
            <h1 class="text-3xl font-black text-center mb-2 text-slate-800 tracking-tight">欢迎回归</h1>
            <p class="text-slate-300 text-[10px] text-center mb-12 font-black uppercase tracking-[0.2em]">东爷国际 Premium Access</p>

            <div class="space-y-5">
                <div class="bg-slate-50 border border-slate-100 rounded-2xl px-6 flex items-center focus-within:border-blue-400 focus-within:bg-white transition-all">
                    <i class="fas fa-user text-slate-200 text-sm"></i>
                    <input type="text" id="username" class="w-full bg-transparent px-4 py-5 outline-none text-sm font-black text-slate-700" placeholder="账号 / Username">
                </div>
                <div class="bg-slate-50 border border-slate-100 rounded-2xl px-6 flex items-center focus-within:border-blue-400 focus-within:bg-white transition-all">
                    <i class="fas fa-lock text-slate-200 text-sm"></i>
                    <input type="password" id="password" class="w-full bg-transparent px-4 py-5 outline-none text-sm font-black text-slate-700" placeholder="密码 / Password">
                </div>
                <button id="loginBtn" onclick="login()" class="w-full bg-blue-600 text-white py-5 rounded-[1.5rem] font-black shadow-xl shadow-blue-100 active:scale-95 transition-all text-sm uppercase tracking-widest mt-4">
                    立即登录
                </button>
            </div>

            <div class="mt-12 flex justify-between items-center px-2">
                <a href="/register.html" class="text-[10px] font-black text-blue-600 uppercase">创建账号</a>
                <span class="w-1 h-1 bg-slate-200 rounded-full"></span>
                <a href="/forgot_password.html" class="text-[10px] font-black text-slate-400 uppercase">找回密码</a>
            </div>
        </div>
        <i class="fas fa-fingerprint absolute -left-6 -bottom-6 text-9xl text-slate-50 rotate-12"></i>
    </div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg;
            t.classList.remove('opacity-0', 'top-10'); t.classList.add('top-12');
            setTimeout(() => { t.classList.add('opacity-0', 'top-10'); t.classList.remove('top-12'); }, 3000);
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            if(!u || !p) return showToast('请填写完整信息');

            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.innerText = '正在验证...';

            try {
                const res = await fetch('/api/login.php', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                }).then(r => r.json());

                if(res.success) {
                    localStorage.removeItem('last_announce_seen'); location.href = res.role === 'admin' ? '/admin/index.php' : '/';
                } else showToast(res.message);
            } catch (err) { showToast('服务器连接异常'); }
            btn.disabled = false; btn.innerText = '立即登录';
        }
    </script>
</body>
</html>
