<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>东爷国际 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .banner-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); }
        .card-premium { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); transition: transform 0.2s; border: 1px solid #e2e8f0; }
        .card-premium:active { transform: scale(0.98); }
        .nav-active { color: #2563eb !important; }
    </style>
</head>
<body class="pb-24">
    <!-- Popup Announcement -->
    <div id="announcement-modal" class="fixed inset-0 z-[2000] bg-slate-900/80 backdrop-blur-md hidden flex items-center justify-center p-8">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm overflow-hidden shadow-2xl relative">
            <div class="bg-blue-600 p-8 text-white text-center">
                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/20">
                    <i class="fas fa-bullhorn text-2xl"></i>
                </div>
                <h3 class="text-xl font-black uppercase tracking-widest">东爷国际公告</h3>
            </div>
            <div class="p-10">
                <p id="announcement-text" class="text-slate-600 font-bold leading-relaxed text-center whitespace-pre-wrap"></p>
                <button onclick="closeAnnouncement()" class="w-full mt-10 py-5 bg-blue-600 text-white rounded-[1.5rem] font-black text-sm shadow-xl shadow-blue-100 active:scale-95 transition-all">我知道了</button>
            </div>
        </div>
    </div>

    <!-- Top Nav -->
    <header class="bg-white px-6 py-4 flex justify-between items-center sticky top-0 z-50 border-b border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                <i class="fas fa-dice text-lg"></i>
            </div>
            <div>
                <h1 class="text-sm font-black text-slate-800 tracking-tight leading-none uppercase">东爷国际</h1>
                <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Official Premium</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right mr-1">
                <p class="text-[8px] font-black text-slate-300 uppercase">Balance</p>
                <p id="user-balance" class="text-xs font-black text-blue-600">¥ 0.00</p>
            </div>
            <img id="user-avatar-small" src="/assets/default_avatar.png" onclick="location.href='/profile.html'" class="w-9 h-9 rounded-full object-cover border-2 border-blue-50 shadow-sm cursor-pointer">
        </div>
    </header>

    <div class="p-5">
        <div class="banner-gradient rounded-[2.5rem] p-8 text-white relative overflow-hidden shadow-2xl shadow-blue-200">
            <div class="relative z-10">
                <h2 class="text-2xl font-black mb-2 uppercase tracking-tighter">至尊东爷 · 财富之巅</h2>
                <p class="text-[10px] font-bold opacity-70 mb-6 leading-relaxed">加拿大官方同步开奖，极速返奖，<br>东爷国际打造全网信誉之最。</p>
                <div class="flex gap-3">
                    <button onclick="location.href='/recharge.html'" class="bg-white text-blue-600 px-6 py-2.5 rounded-2xl text-[10px] font-black">立即充值</button>
                    <button onclick="toggleChat()" class="bg-blue-400/30 backdrop-blur-sm px-6 py-2.5 rounded-2xl text-[10px] font-black border border-white/20">咨询客服</button>
                </div>
            </div>
            <i class="fas fa-crown absolute -right-4 -bottom-4 text-[10rem] opacity-10 rotate-12"></i>
        </div>
    </div>

    <!-- Notice -->
    <div class="px-5 mb-6">
        <div class="bg-white rounded-2xl px-5 py-3 flex items-center gap-3 border border-slate-100 shadow-sm">
            <div class="w-8 h-8 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center shrink-0"><i class="fas fa-volume-up text-xs"></i></div>
            <marquee id="announce" class="text-[10px] font-black text-slate-500 uppercase tracking-wider">东爷国际，期待您的加入...</marquee>
        </div>
    </div>

    <!-- Game Selection -->
    <div class="px-5 space-y-5">
        <div class="grid grid-cols-2 gap-4">
            <div onclick="location.href='/game.html?room=high'" class="card-premium p-6 relative overflow-hidden bg-blue-600 border-blue-500">
                <div class="relative z-10 space-y-4">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white text-xl"><i class="fas fa-gem"></i></div>
                    <h4 class="text-white font-black text-sm">至尊高倍房</h4>
                </div>
            </div>
            <div onclick="location.href='/game.html?room=low'" class="card-premium p-6 relative overflow-hidden">
                <div class="relative z-10 space-y-4">
                    <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 text-xl"><i class="fas fa-chess-knight"></i></div>
                    <h4 class="text-slate-800 font-black text-sm">经典标准房</h4>
                </div>
            </div>
            <div onclick="location.href='/red_packet.html'" class="col-span-2 card-premium p-5 flex items-center justify-between border-rose-100 bg-rose-50/30">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-rose-500 text-white rounded-2xl flex items-center justify-center shadow-lg"><i class="fas fa-gift"></i></div>
                    <div><h4 class="text-rose-900 font-black text-sm">官方红包群</h4><p class="text-[9px] text-rose-400 font-bold uppercase">Daily Cash Rewards</p></div>
                </div>
                <i class="fas fa-chevron-right text-rose-200 text-xs"></i>
            </div>
        </div>
    </div>

    <!-- Latest Results -->
    <div class="px-5 mt-8 pb-10">
        <h3 class="text-[10px] font-black text-slate-400 mb-4 px-2 uppercase tracking-widest">Live Drawing Results</h3>
        <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden" id="results-container"></div>
    </div>

    <!-- Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 p-4 pb-8 flex justify-around items-center z-[500] shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
        <a href="/" class="nav-active flex flex-col items-center gap-1"><i class="fas fa-compass text-xl"></i><span class="text-[8px] font-black uppercase">大厅</span></a>
        <a href="/recharge.html" class="text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-wallet text-xl"></i><span class="text-[8px] font-black uppercase">充值</span></a>
        <button onclick="toggleChat()" class="text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-headset text-xl"></i><span class="text-[8px] font-black uppercase">客服</span></button>
        <a href="/profile.html" class="text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-user-ninja text-xl"></i><span class="text-[8px] font-black uppercase">我的</span></a>
    </nav>

    <!-- Chat Overlay -->
    <div id="chat-overlay" class="fixed inset-0 z-[1000] bg-slate-900/60 backdrop-blur-sm hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[3rem] h-[90vh] flex flex-col shadow-2xl">
            <div class="p-8 flex justify-between items-center border-b border-slate-50 shrink-0">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-xl"><i class="fas fa-headset"></i></div>
                    <div><h2 class="text-lg font-black text-slate-800">VIP 专属客服</h2><p class="text-[9px] text-emerald-500 font-black uppercase tracking-widest flex items-center gap-1">Online Support</p></div>
                </div>
                <button onclick="toggleChat()" class="w-12 h-12 rounded-2xl bg-slate-50 text-slate-300 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-box" class="flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50/50"></div>
            <div class="p-8 bg-white border-t border-slate-50 flex gap-4">
                <input type="text" id="chat-input" class="flex-1 bg-slate-50 border-none rounded-2xl px-6 font-bold text-sm outline-none" placeholder="描述您的问题...">
                <button onclick="sendChatMessage()" class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-lg"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        let chatImg = '';
        async function load() {
            try {
                const [l, u, s] = await Promise.all([
                    fetch('/api/lottery.php').then(r => r.json()),
                    fetch('/api/user_info.php?include_avatar=1').then(r => r.json()),
                    fetch('/api/system_info.php?action=get_settings').then(r => r.json())
                ]);

                if(l.success) {
                    document.getElementById('results-container').innerHTML = l.history.slice(0, 5).map(i => `
                        <div class="p-6 flex justify-between items-center border-b border-slate-50 last:border-0">
                            <div><p class="text-[9px] font-black text-slate-300 uppercase">#${i.issue_no}</p></div>
                            <div class="flex items-center gap-4">
                                <div class="flex gap-1.5">${i.numbers.split(',').map(n => `<span class="w-7 h-7 bg-white border border-slate-200 rounded-full flex items-center justify-center text-[10px] font-black text-slate-700 shadow-sm">${n}</span>`).join('')}</div>
                                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xs font-black shadow-lg shadow-blue-100">${i.total_sum}</div>
                            </div>
                        </div>
                    `).join('');
                }

                if(u.success) {
                    document.getElementById('user-balance').innerText = '¥ ' + parseFloat(u.user.balance).toLocaleString();
                    if(u.user.avatar) document.getElementById('user-avatar-small').src = u.user.avatar;
                } else location.href = '/login.html';

                if(s.success) {
                    document.getElementById('announce').innerText = s.data.announcement || '欢迎来到东爷国际';
                    if(s.data.login_announcement && !localStorage.getItem('last_announce_seen')) {
                        document.getElementById('announcement-text').innerText = s.data.login_announcement;
                        document.getElementById('announcement-modal').classList.remove('hidden');
                        localStorage.setItem('last_announce_seen', '1');
                    }
                }
            } catch(e) {}
        }

        function closeAnnouncement() { document.getElementById('announcement-modal').classList.add('hidden'); }
        function toggleChat() { document.getElementById('chat-overlay').classList.toggle('hidden'); if(!document.getElementById('chat-overlay').classList.contains('hidden')) loadChat(); }

        async function loadChat() {
            const res = await fetch('/api/chat.php').then(r => r.json());
            if(res.success) {
                const box = document.getElementById('chat-box');
                box.innerHTML = res.data.map(m => `
                    <div class="flex ${m.sender_id == 0 ? '' : 'justify-end'}">
                        <div class="max-w-[85%] p-5 rounded-3xl ${m.sender_id == 0 ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-800 border border-slate-100 shadow-sm'}">
                            <p class="text-sm font-bold leading-relaxed">${m.message}</p>
                        </div>
                    </div>
                `).join('');
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendChatMessage() {
            const i = document.getElementById('chat-input'); const msg = i.value.trim(); if(!msg) return;
            const res = await fetch('/api/chat.php?action=send', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: msg, type: 'text' })
            }).then(r => r.json());
            if(res.success) { i.value = ''; loadChat(); }
        }

        load(); setInterval(load, 15000);
    </script>
</body>
</html>
