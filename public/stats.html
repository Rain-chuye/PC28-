<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据报表 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .card-p { background: white; border-radius: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="p-6 pb-24">
    <header class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <button onclick="history.back()" class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center text-slate-400 shadow-sm border border-slate-100"><i class="fas fa-chevron-left text-sm"></i></button>
            <div>
                <h1 class="text-lg font-black text-slate-800">报表分析</h1>
                <p class="text-[8px] font-black text-slate-300 uppercase tracking-widest">Financial Analytics</p>
            </div>
        </div>
        <i class="fas fa-chart-line text-slate-200 text-3xl"></i>
    </header>

    <div class="space-y-6">
        <div class="card-p p-8">
            <h3 class="text-[10px] font-black text-slate-400 uppercase mb-8 tracking-[0.2em]">近 7 日资金走向趋势</h3>
            <div class="relative h-64">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="card-p p-8">
            <h3 class="text-[10px] font-black text-slate-400 uppercase mb-6 tracking-[0.2em]">投注偏好权重分析</h3>
            <div id="pref-bars" class="space-y-6"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="card-p p-6 bg-blue-600 border-blue-500 shadow-xl shadow-blue-100">
                <p class="text-[9px] font-black text-white/50 uppercase mb-2 tracking-widest">今日总流水</p>
                <p id="stat-turnover" class="text-xl font-black text-white">¥ 0.00</p>
            </div>
            <div class="card-p p-6 bg-emerald-500 border-emerald-400 shadow-xl shadow-emerald-100">
                <p class="text-[9px] font-black text-white/50 uppercase mb-2 tracking-widest">今日总盈亏</p>
                <p id="stat-profit" class="text-xl font-black text-white">¥ 0.00</p>
            </div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const res = await fetch('/api/user_stats.php').then(r => r.json());
                if(res.success) {
                    const data = res.data;
                    const ctx = document.getElementById('mainChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.dates,
                            datasets: [
                                { label: '流水', data: data.turnovers, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)', fill: true, tension: 0.4, borderWidth: 4, pointRadius: 0 },
                                { label: '盈亏', data: data.profits, borderColor: '#10b981', backgroundColor: 'transparent', tension: 0.4, borderWidth: 2, pointRadius: 0, borderDash: [5, 5] }
                            ]
                        },
                        options: {
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' } },
                                x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' } }
                            }
                        }
                    });

                    const prefContainer = document.getElementById('pref-bars');
                    const total = data.total_count || 1;
                    const combos = ['big_single','big_double','small_single','small_double'];
                    let comboCount = 0;
                    Object.entries(data.types || {}).forEach(([type, count]) => { if(combos.includes(type)) comboCount += count; });
                    const comboPerc = Math.round((comboCount / total) * 100);
                    const basicPerc = 100 - comboPerc;

                    prefContainer.innerHTML = `
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-black uppercase text-slate-400 tracking-widest"><span>组合类玩法</span><span>${comboPerc}%</span></div>
                            <div class="w-full h-2.5 bg-slate-50 rounded-full overflow-hidden"><div class="h-full bg-blue-600 rounded-full" style="width: ${comboPerc}%"></div></div>
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between text-[10px] font-black uppercase text-slate-400 tracking-widest"><span>基础类玩法</span><span>${basicPerc}%</span></div>
                            <div class="w-full h-2.5 bg-slate-50 rounded-full overflow-hidden"><div class="h-full bg-slate-300 rounded-full" style="width: ${basicPerc}%"></div></div>
                        </div>
                    `;

                    document.getElementById('stat-turnover').innerText = '¥ ' + (data.today_turnover || 0).toLocaleString();
                    document.getElementById('stat-profit').innerText = (data.today_profit >= 0 ? '+¥ ' : '-¥ ') + Math.abs(data.today_profit || 0).toLocaleString();
                }
            } catch(e) {}
        }
        loadStats();
    </script>
</body>
</html>
