<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - 东爷国际 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); font-family: -apple-system, sans-serif; }
        .card-auth { background: white; border-radius: 3rem; border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm card-auth p-12 relative overflow-hidden">
        <div class="relative z-10">
            <h1 class="text-3xl font-black text-center mb-2 text-slate-800 tracking-tight">重置密码</h1>
            <p class="text-slate-300 text-[10px] text-center mb-12 font-black uppercase tracking-[0.2em]">Security Reset Access</p>

            <div class="space-y-5">
                <div class="bg-slate-50 border border-slate-100 rounded-2xl px-6 flex items-center focus-within:border-blue-400 focus-within:bg-white transition-all">
                    <i class="fas fa-user text-slate-200 text-xs"></i>
                    <input type="text" id="username" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-black text-slate-700" placeholder="账号 / Username">
                </div>
                <div class="bg-slate-50 border border-slate-100 rounded-2xl px-6 flex items-center focus-within:border-blue-400 focus-within:bg-white transition-all">
                    <i class="fab fa-qq text-slate-200 text-xs"></i>
                    <input type="text" id="qq" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-black text-slate-700" placeholder="关联的 QQ 号">
                </div>
                <div class="bg-slate-50 border border-slate-100 rounded-2xl px-6 flex items-center focus-within:border-blue-400 focus-within:bg-white transition-all">
                    <i class="fas fa-key text-slate-200 text-xs"></i>
                    <input type="password" id="password" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-black text-slate-700" placeholder="设置新密码">
                </div>
                <button onclick="resetPass()" class="w-full bg-blue-600 text-white py-5 rounded-[1.5rem] font-black shadow-xl shadow-blue-100 active:scale-95 transition-all text-sm uppercase tracking-widest mt-4">
                    重置并登录
                </button>
            </div>

            <p class="mt-10 text-center text-[10px] font-black text-slate-400 uppercase"><a href="/login.html" class="text-blue-600">返回登录界面</a></p>
        </div>
        <i class="fas fa-lock-open absolute -left-6 -bottom-6 text-9xl text-slate-50 rotate-12"></i>
    </div>

    <script>
        async function resetPass() {
            const u = document.getElementById('username').value.trim();
            const q = document.getElementById('qq').value.trim();
            const p = document.getElementById('password').value;
            if(!u || !q || !p) return alert('请填写完整信息');

            const res = await fetch('/api/forgot_password.php', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, qq: q, password: p})
            }).then(r => r.json());

            alert(res.message);
            if(res.success) location.href = '/login.html';
        }
    </script>
</body>
</html>
